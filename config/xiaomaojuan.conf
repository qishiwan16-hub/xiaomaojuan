# 小猫卷配置文件
# 修改后重新运行 ./xiaomaojuan.sh 即可生效。
# 路径支持写成绝对路径，也支持使用 $HOME 或 ~/ 开头。

# 脚本显示名称，会出现在首页和标题区。
XMJ_SCRIPT_NAME="小猫卷"

# 作者名称，只用于展示。
XMJ_SCRIPT_AUTHOR="meoroll"

# 目标项目名称，只用于展示。
XMJ_TARGET_PROJECT="SillyTavern"

# SillyTavern 实际目录。
# 如果你装在别的位置，请改成自己的真实路径。
XMJ_SILLYTAVERN_PATH="$HOME/SillyTavern"

# 备份目录。
# 可以写相对路径，例如 backups；相对路径会自动以脚本根目录为基准。
XMJ_BACKUP_DIR="backups"

# 主题模式。
# 可选值：pastel / moonlight
XMJ_THEME_MODE="pastel"

# 当前运行环境说明，会显示在首页信息区。
XMJ_RUNTIME_ENV="Termux / Android / Bash"

# 内置 Termux 字体预设名称。
XMJ_TERMUX_FONT_PRESET_NAME="京华老宋体"

# 内置 Termux 字体预设下载地址。
XMJ_TERMUX_FONT_PRESET_URL="https://www.ziti.net.cn/static/upload/other/20251228/1766904933891599.ttf"

# 内置 Termux 字体预设 MD5，用于校验下载结果。
XMJ_TERMUX_FONT_PRESET_MD5="fcde959ec23bf4bbd4de52514f1909e9"
